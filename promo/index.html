<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Акции NovaPos.kz</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f9fc;
            color: #1f2937;
        }
        .promo-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .promo-card {
            max-width: 640px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px;
            text-align: center;
        }
        .promo-card h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }
        .promo-card p {
            margin: 0 0 24px;
            font-size: 18px;
            line-height: 1.6;
            color: #4b5563;
        }
        .promo-link {
            display: inline-block;
            padding: 12px 24px;
            background: #1d4ed8;
            color: white;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 600;
        }
        .promo-link:hover {
            background: #1e40af;
        }
    </style>
</head>
<body>
    <main class="promo-page">
        <section class="promo-card">
            <h1>Акции NovaPos.kz</h1>
            <p>Следите за актуальными предложениями для вашего бизнеса и выгодными условиями по внедрению и обслуживанию.</p>
            <a href="../index.html" class="promo-link">Вернуться на главную</a>
        </section>
    </main>
</body>
</html>
