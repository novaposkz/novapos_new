    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        .trusted-hero-section {
            padding: 30px 20px clamp(140px, 16vw, 200px);
            text-align: center;
            background: linear-gradient(to right, #1f1f1f, #5d5d5d);
            min-height: 30vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Mobile styles for trusted page */
        @media (max-width: 768px) {
            .trusted-hero-section {
                padding: 5px 20px clamp(140px, 16vw, 200px);
            }
        }

        .trusted-hero-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: clamp(48px, 8vw, 96px);
            margin: 0 0 40px;
            line-height: 1.1;
        }

        .trusted-hero-title-line1 {
            color: #ffffff;
            display: block;
            margin-bottom: 10px;
        }

        .trusted-hero-title-line2 {
            background: linear-gradient(to right, #5871f1, #7ecfff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
        }

        .trusted-hero-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            font-size: clamp(18px, 2.5vw, 24px);
            color: #ffffff;
            margin: 0 0 20px;
            max-width: 800px;
            line-height: 1.5;
        }

        .trusted-badge-section {
            padding: 60px 20px;
            background: #004585;
            text-align: center;
        }

        .trusted-badge {
            display: inline-block;
            padding: 15px 30px;
            background: #2b6193;
            border-radius: 25px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: clamp(16px, 2vw, 20px);
            color: #ffffff;
            margin-bottom: 60px;
        }

        .trusted-logos-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .trusted-logos-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
            justify-items: center;
        }

        .trusted-logo-item {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .trusted-logo-item:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.15);
        }

        .trusted-logo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Mobile styles for logos */
        @media (max-width: 768px) {
            .trusted-logos-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 30px;
            }

            .trusted-logo-item {
                width: 100px;
                height: 100px;
            }
        }

        /* Override navbar background for trusted page */
        .top-navbar {
            background: linear-gradient(to right, #1f1f1f, #5d5d5d) !important;
        }
    </style>
