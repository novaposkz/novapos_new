    <script>
        // Category filtering functionality
        document.addEventListener('DOMContentLoaded', function() {
            const categoryButtons = document.querySelectorAll('.category-btn');
            
            categoryButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Remove active class from all buttons
                    categoryButtons.forEach(btn => btn.classList.remove('active'));
                    
                    // Add active class to clicked button
                    this.classList.add('active');
                    
                    // Get selected category
                    const selectedCategory = this.getAttribute('data-category');
                    
                    // Here you can add filtering logic
                    console.log('Selected category:', selectedCategory);
                    
                    // Placeholder for filtering knowledge content
                    filterKnowledgeContent(selectedCategory);
                });
            });
            
            function filterKnowledgeContent(category, program = 'all') {
                // This function will filter the knowledge content based on category and program
                const knowledgeContent = document.querySelector('.knowledge-content');
                
                // Knowledge cards HTML
                const knowledgeCards = `
                    <div class="knowledge-grid">
                        <div class="knowledge-card" data-category="video" data-program="gbs">
                            <div class="video-icon-box">
                                <i class="fas fa-play"></i>
                            </div>
                            <div class="program-badge">GBS.Market</div>
                            <div class="video-title">Настройка принтера чеков</div>
                            <div class="video-description">
                                Подробное видео-руководство по подключению и настройке чекового принтера
                            </div>
                            <a href="#" class="watch-btn">Смотреть урок</a>
                        </div>
                        <div class="knowledge-card" data-category="video" data-program="moysklad">
                            <div class="video-icon-box">
                                <i class="fas fa-play"></i>
                            </div>
                            <div class="program-badge">МойСклад</div>
                            <div class="video-title">Интеграция с МойСклад</div>
                            <div class="video-description">
                                Видео-урок по настройке интеграции GBS.Market с МойСклад
                            </div>
                            <a href="#" class="watch-btn">Смотреть урок</a>
                        </div>
                        <div class="knowledge-card" data-category="video" data-program="gbs">
                            <div class="video-icon-box">
                                <i class="fas fa-play"></i>
                            </div>
                            <div class="program-badge">GBS.Market</div>
                            <div class="video-title">Работа с весами</div>
                            <div class="video-description">
                                Подключение и калибровка торговых весов в GBS.Market
                            </div>
                            <a href="#" class="watch-btn">Смотреть урок</a>
                        </div>
                        <div class="knowledge-card" data-category="instructions" data-program="gbs">
                            <div class="article-icon-box">
                                <img src="../images/drivers/gbs6.png" alt="GBS.Market" style="max-width: 160px; max-height: 80px;">
                            </div>
                            <div class="article-content">
                                <div class="program-badge">GBS.Market</div>
                                <div class="article-title">Инструкция по весам</div>
                                <div class="article-description">
                                    Пошаговая инструкция по калибровке и использованию торговых весов
                                </div>
                                <a href="#" class="read-btn">Читать статью <i class="fas fa-arrow-right"></i></a>
                            </div>
                        </div>
                        <div class="knowledge-card" data-category="instructions" data-program="moysklad">
                            <div class="article-icon-box">
                                <img src="../images/moysklad.png" alt="МойСклад" style="max-width: 160px; max-height: 80px;">
                            </div>
                            <div class="article-content">
                                <div class="program-badge">МойСклад</div>
                                <div class="article-title">Синхронизация данных</div>
                                <div class="article-description">
                                    Настройка автоматической синхронизации товаров и заказов
                                </div>
                                <a href="#" class="read-btn">Читать статью <i class="fas fa-arrow-right"></i></a>
                            </div>
                        </div>
                        <div class="knowledge-card" data-category="video" data-program="gbs">
                            <div class="video-icon-box">
                                <i class="fas fa-play"></i>
                            </div>
                            <div class="program-badge">GBS.Market</div>
                            <div class="video-title">Установка сканера штрих-кодов</div>
                            <div class="video-description">
                                Видео-урок по установке и настройке сканера для работы с кассой
                            </div>
                            <a href="#" class="watch-btn">Смотреть урок</a>
                        </div>
                    </div>
                `;
                
                // Create a temporary DOM element to parse the HTML
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = knowledgeCards;
                const allCards = Array.from(tempDiv.querySelectorAll('.knowledge-card'));
                
                // Filter cards based on category and program
                let content = '';
                
                switch(category) {
                    case 'video':
                        let videoCards = allCards.filter(card => card.getAttribute('data-category') === 'video');
                        if (program !== 'all') {
                            videoCards = videoCards.filter(card => card.getAttribute('data-program') === program);
                        }
                        content = '<div class="knowledge-grid">' + videoCards.map(card => card.outerHTML).join('') + '</div>';
                        break;
                    case 'instructions':
                        let instructionCards = allCards.filter(card => card.getAttribute('data-category') === 'instructions');
                        if (program !== 'all') {
                            instructionCards = instructionCards.filter(card => card.getAttribute('data-program') === program);
                        }
                        content = '<div class="knowledge-grid">' + instructionCards.map(card => card.outerHTML).join('') + '</div>';
                        break;
                    default:
                        content = '<p style="color: white; text-align: center;">Выберите категорию</p>';
                }
                
                knowledgeContent.innerHTML = content;
            }
            
            // Program filter functionality
            const programFilter = document.getElementById('programFilter');
            const programDropdown = document.getElementById('programDropdown');
            const programOptions = document.querySelectorAll('.program-option');
            let currentProgram = 'all';
            
            programFilter.addEventListener('click', function() {
                programDropdown.classList.toggle('show');
                programFilter.classList.toggle('active');
            });
            
            programOptions.forEach(option => {
                option.addEventListener('click', function(e) {
                    e.stopPropagation();
                    
                    // Remove active class from all options
                    programOptions.forEach(opt => opt.classList.remove('active'));
                    
                    // Add active class to clicked option
                    this.classList.add('active');
                    
                    // Update filter text
                    const filterText = this.textContent;
                    programFilter.querySelector('span').textContent = filterText;
                    
                    // Update current program
                    currentProgram = this.getAttribute('data-program');
                    
                    // Close dropdown
                    programDropdown.classList.remove('show');
                    programFilter.classList.remove('active');
                    
                    // Re-filter content with new program filter
                    const activeCategory = document.querySelector('.category-btn.active').getAttribute('data-category');
                    filterKnowledgeContent(activeCategory, currentProgram);
                });
            });
            
            // Close dropdown when clicking outside
            document.addEventListener('click', function(e) {
                if (!programFilter.contains(e.target)) {
                    programDropdown.classList.remove('show');
                    programFilter.classList.remove('active');
                }
            });
            
            // Initialize with "video" category
            filterKnowledgeContent('video', 'all');
        });
    </script>
</body>
</html>
