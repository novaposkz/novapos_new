<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Программы для автоматизации бизнеса: от розничного магазина до салона красоты и оптовых продаж.">
    <title>Программы для автоматизации — Novapos</title>
    <link rel="icon" href="../images/favicon.png">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,900&display=swap');

        body {
            background: linear-gradient(to bottom right, #191919, #646464) !important;
            margin: 0 !important;
            padding: 0 !important;
            min-height: 100vh !important;
        }

        .navbar,
        .top-navbar {
            background: transparent !important;
        }

        .rosta-hero-header {
            text-align: center !important;
            padding: 100px 10% 60px 10% !important;
            max-width: 1200px !important;
            margin: 0 auto !important;
        }

        .rosta-hero-header .main-title {
            font-family: 'Montserrat', sans-serif !important;
            font-weight: 900 !important;
            font-size: 72px !important;
            color: #ffffff !important;
            margin: 0 0 30px 0 !important;
            line-height: 1.1 !important;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3) !important;
        }

        .rosta-hero-header .description {
            font-family: 'Montserrat', sans-serif !important;
            font-weight: 400 !important;
            font-size: 20px !important;
            color: #ffffff !important;
            line-height: 1.6 !important;
            max-width: 800px !important;
            margin: 0 auto 40px auto !important;
        }

        .rosta-overview-section {
            background-color: #003771 !important;
            padding: 60px 10% !important;
            text-align: center !important;
        }

        .rosta-overview-badge {
            display: inline-block !important;
            padding: 15px 30px !important;
            background-color: #2c5584 !important;
            border-radius: 25px !important;
            font-family: 'Montserrat', sans-serif !important;
            font-weight: 600 !important;
            font-size: clamp(16px, 2vw, 20px) !important;
            color: #ffffff !important;
        }

        @media (max-width: 768px) {
            .rosta-hero-header {
                padding: 60px 5% 40px 5% !important;
            }

            .rosta-hero-header .main-title {
                font-size: 36px !important;
                margin-bottom: 20px !important;
            }

            .rosta-hero-header .description {
                font-size: 16px !important;
                max-width: 100% !important;
                margin-bottom: 30px !important;
            }

            .rosta-overview-section {
                padding: 40px 5% !important;
            }
        }

        @media (max-width: 480px) {
            .rosta-hero-header .main-title {
                font-size: 28px !important;
            }

            .rosta-hero-header .description {
                font-size: 14px !important;
                margin-bottom: 25px !important;
            }
        }

    </style>
</head>
<body>
    <div id="top-navbar"></div>

    <main>
        <div class="rosta-hero-header">
            <h1 class="main-title">Программы для автоматизации<br>вашего бизнеса</h1>
            <p class="description">
                Выберите идеальную систему под ваши задачи: от розничного магазина до
                салона красоты и оптовых продаж.
            </p>
        </div>

        <section class="rosta-overview-section" aria-label="Обзор решений">
            <span class="rosta-overview-badge">Обзор решений</span>
        </section>
    </main>

    <div id="footer"></div>
    <script src="../scripts/navbar-loader.js"></script>
    <script src="../scripts/scripts.js"></script>
</body>
</html>
